<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' data:">
<title>Agents</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dock right" id="dock">
  <!-- top bar follows the dock width → icons stay at the right end -->
  <div class="top" id="top">
    <span class="grip">⋮⋮</span><span class="title">Agents</span>
    <button class="ibtn" id="refresh" title="Refresh (remove sessions whose VS Code window is closed)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <button class="ibtn" id="theme" title="Dark mode">
      <svg class="moon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
      <svg class="sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="ibtn" id="pin" title="Keep expanded">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="pin-body" d="M9 3h6l-1 6 3.5 3.5V15h-11v-2.5L10 9 9 3Z"/><path d="M12 15v6.5"/></svg>
    </button>
  </div>
  <div class="inner">
    <div class="list" id="list"></div>
  </div>
</div>
<!-- alert bubbles: beside the dock, on the screen-center side -->
<div class="bubbles" id="bubbles"></div>
<script src="renderer.js"></script>
</body>
</html>
