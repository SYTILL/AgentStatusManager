<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' data:">
<title>Agents</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-layout="vertical" data-side="right">
<template id="tools">
  <button class="ibtn act-refresh" title="Refresh (remove sessions whose VS Code window is closed)">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
  <button class="ibtn act-theme" title="Dark mode">
    <svg class="moon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
    <svg class="sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button class="ibtn act-settings" title="Settings">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>
</template>

<!-- vertical layout: side dock -->
<div class="dock right" id="dock">
  <!-- top bar follows the dock width → icons stay at the right end -->
  <div class="top drag-handle" id="top">
    <span class="grip">⋮⋮</span><span class="title">Agents</span>
    <span class="tools-slot"></span>
  </div>
  <div class="inner">
    <div class="list" id="list"></div>
  </div>
</div>

<!-- horizontal layout: top bar split into equal segments; hover a segment for its details -->
<div class="hwrap" id="hwrap">
  <div class="hbar" id="hbar">
    <div class="hgrip drag-handle"><span class="grip">⋮⋮</span><span class="title">Agents</span></div>
    <div class="segs" id="segs"></div>
    <div class="htools tools-slot"></div>
  </div>
  <!-- "Always expanded": a card under every segment -->
  <div class="hcards" id="hcards"></div>
</div>

<!-- alert bubbles: beside the dock (vertical) or under the segment (horizontal) -->
<div class="bubbles" id="bubbles"></div>
<script src="renderer.js"></script>
</body>
</html>
